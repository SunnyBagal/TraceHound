name: TraceHound review

on:
  push:
    branches: [main] # Use your repository's default branch.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions: {} # Each job asks for what it needs.

jobs:
  review:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    # A newer push to the PR cancels the superseded review.
    concurrency:
      group: tracehound-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      # Pin to a reviewed commit SHA before enabling this in your repository.
      - uses: SunnyBagal/TraceHound/.github/actions/tracehound-review@main
        with:
          nebius-api-key: ${{ secrets.NEBIUS_API_KEY }}
          max-comments: '15'
          dry-run: 'false'
          data-branch: 'off'

  # Graph history. Delete this job and the push trigger for review only.
  data:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    # One data write per repository at a time; a running write is never cancelled.
    concurrency:
      group: tracehound-data-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # The changes CLI needs both base and head commits.
          persist-credentials: false
      # Pin to a reviewed commit SHA before enabling this in your repository.
      - uses: SunnyBagal/TraceHound/.github/actions/tracehound-review@main
        with:
          nebius-api-key: ${{ secrets.NEBIUS_API_KEY }} # Required input; max-comments '0' makes no model call.
          max-comments: '0'
          data-branch: 'on'
