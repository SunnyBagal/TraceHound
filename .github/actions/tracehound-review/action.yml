name: TraceHound review
description: Review a pull request with TraceHound and post unverified findings as line comments.
inputs:
  nebius-api-key:
    description: Nebius Token Factory API key
    required: true
  model:
    description: Nemotron model ID (empty uses each stage's default)
    required: false
    default: 'nvidia/Nemotron-3.5-Super-VL'
  reviewer:
    description: Reviewer pipeline (pool-verify-v1 or review-diff-v1)
    required: false
    default: 'pool-verify-v1'
  max-comments:
    description: Maximum findings to include, including findings in the review body
    required: false
    default: '15'
  fixes:
    description: Propose untested model-generated fixes (on or off; pool-verify-v1 only)
    required: false
    default: 'on'
  learn:
    description: Suppress findings similar to maintainer-rejected comments (on or off; pool-verify-v1 only)
    required: false
    default: 'off'
  contracts:
    description: Check deterministic cross-file contracts alongside the reviewer (on or off)
    required: false
    default: 'on'
  dry-run:
    description: Print the review JSON without posting (still runs the reviewer)
    required: false
    default: 'false'
  data-branch:
    description: Persist heuristic graph history to tracehound-data (on or off; requires contents write)
    required: false
    default: 'off'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 11.20.0
        run_install: false
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Install TraceHound reviewer dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      run: pnpm install --frozen-lockfile --ignore-scripts --filter @tracehound/analyzer...
    - name: Review and post findings
      if: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        NEBIUS_API_KEY: ${{ inputs.nebius-api-key }}
        GITHUB_TOKEN: ${{ github.token }}
        TRACEHOUND_MODEL: ${{ inputs.model }}
        TRACEHOUND_REVIEWER: ${{ inputs.reviewer }}
        TRACEHOUND_REPO_DIR: ${{ github.workspace }}
        TRACEHOUND_MAX_COMMENTS: ${{ inputs.max-comments }}
        TRACEHOUND_FIXES: ${{ inputs.fixes }}
        TRACEHOUND_LEARN: ${{ inputs.learn }}
        TRACEHOUND_CONTRACTS: ${{ inputs.contracts }}
        TRACEHOUND_DRY_RUN: ${{ inputs.dry-run }}
        TRACEHOUND_REVIEW_FILE: ${{ runner.temp }}/tracehound-review-${{ github.run_id }}-${{ github.run_attempt }}.json
      run: node packages/action/src/cli.ts
    - name: Write graph history
      if: ${{ !cancelled() && inputs.data-branch == 'on' }}
      continue-on-error: true
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        GITHUB_TOKEN: ${{ github.token }}
        TRACEHOUND_REPO_DIR: ${{ github.workspace }}
        TRACEHOUND_REVIEW_FILE: ${{ runner.temp }}/tracehound-review-${{ github.run_id }}-${{ github.run_attempt }}.json
      run: node packages/action/src/data.ts
