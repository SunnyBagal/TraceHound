name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    # Never needs NEBIUS_API_KEY: tests use a fake server and block the network.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fetch pinned demo repo (public, for the integration test)
        run: pnpm fixture

      - name: Snapshot version guard (every repo's latest snapshot is the current analyzer version)
        run: node packages/analyzer/src/version-guard.ts snapshots

      - name: Tests (analyzer + viewer)
        run: pnpm test
        env:
          # harness-infra: clone the demo fork from GitHub + bun install inside a Docker sandbox
          TRACEHOUND_NETWORK_TESTS: "1"

      - name: Typecheck
        run: pnpm typecheck

      - name: Build static viewer
        run: pnpm --filter @tracehound/viewer build

      - name: Assert the export can load data (top-level latest and every repo's latest)
        run: |
          test -f viewer/out/snapshots/index.json || { echo "::error::viewer/out/snapshots/index.json missing"; exit 1; }
          node -e '
            const fs = require("fs");
            const dir = "viewer/out/snapshots";
            const index = JSON.parse(fs.readFileSync(dir + "/index.json", "utf8"));
            const want = [["latest", index.latest && index.latest.path], ...(index.repos || []).map((r) => ["repo " + r.id, r.latest && r.latest.path])];
            if (!(index.repos || []).length) { console.log("::error::index.json lists no repos"); process.exit(1); }
            if (index.defaultRepo && !index.repos.some((r) => r.id === index.defaultRepo)) { console.log("::error::defaultRepo " + index.defaultRepo + " is not in repos"); process.exit(1); }
            for (const [what, rel] of want) {
              if (!rel || !fs.existsSync(dir + "/" + rel)) { console.log("::error::" + what + " snapshot " + rel + " missing from export"); process.exit(1); }
              const snap = JSON.parse(fs.readFileSync(dir + "/" + rel, "utf8"));
              console.log("export OK: " + what + " → " + rel + " (" + snap.repo.name + ", " + snap.components.length + " components)");
            }
          '
