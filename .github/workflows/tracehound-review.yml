name: TraceHound review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: tracehound-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      # Update this main-commit pin by hand after action changes.
      - uses: SunnyBagal/TraceHound/.github/actions/tracehound-review@e4e3e3a8c4d46c270c6027dca564cfe3acb8bc52
        with:
          nebius-api-key: ${{ secrets.NEBIUS_API_KEY }}
          max-comments: '10'
          dry-run: 'false'
